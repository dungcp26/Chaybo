name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen du an
        run: |
          if [ -f TroLyChayBo.zip ]; then unzip -oq TroLyChayBo.zip; fi
          ls
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle -p TroLyChayBo assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TroLyChayBo-apk
          path: TroLyChayBo/app/build/outputs/apk/debug/app-debug.apk
